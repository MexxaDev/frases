<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <title>TuFraseDeHoy</title>
</head>
<body>
    <div class="cosmic-bg">
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="nebula nebula-3"></div>
        <div class="galaxy-texture"></div>
    </div>
    
    <div class="stars-container">
        <svg class="star" style="top: 8%; left: 12%; width: 8px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2" fill="#f5f0e6"/></svg>
        <svg class="star" style="top: 15%; left: 85%; width: 6px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1.5" fill="#f5f0e6"/></svg>
        <svg class="star" style="top: 25%; left: 5%; width: 10px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5" fill="#f5f0e6"/></svg>
        <svg class="star" style="top: 35%; left: 92%; width: 5px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1" fill="#f5f0e6"/></svg>
        <svg class="star" style="top: 45%; left: 3%; width: 7px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1.5" fill="#f5f0e6"/></svg>
        <svg class="star" style="top: 55%; left: 88%; width: 9px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2" fill="#f5f0e6"/></svg>
        <svg class="star" style="top: 65%; left: 10%; width: 6px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1.5" fill="#f5f0e6"/></svg>
        <svg class="star" style="top: 75%; left: 78%; width: 8px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2" fill="#f5f0e6"/></svg>
        <svg class="star" style="top: 85%; left: 20%; width: 5px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1" fill="#f5f0e6"/></svg>
        <svg class="star" style="top: 90%; left: 65%; width: 7px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1.5" fill="#f5f0e6"/></svg>
        
        <svg class="sparkle" style="top: 12%; left: 45%; width: 16px;" viewBox="0 0 30 30">
            <path d="M15 0 L17 13 L30 15 L17 17 L15 30 L13 17 L0 15 L13 13 Z" fill="#f5f0e6" opacity="0.6"/>
        </svg>
        <svg class="sparkle" style="top: 30%; left: 70%; width: 12px;" viewBox="0 0 30 30">
            <path d="M15 0 L17 13 L30 15 L17 17 L15 30 L13 17 L0 15 L13 13 Z" fill="#f5f0e6" opacity="0.5"/>
        </svg>
        <svg class="sparkle" style="top: 60%; left: 25%; width: 14px;" viewBox="0 0 30 30">
            <path d="M15 0 L17 13 L30 15 L17 17 L15 30 L13 17 L0 15 L13 13 Z" fill="#f5f0e6" opacity="0.4"/>
        </svg>
        
        <svg class="constellation-line" style="top: 20%; left: 30%; width: 150px;" viewBox="0 0 150 80">
            <path d="M10 40 Q40 20 70 50 T130 30" stroke="#f5f0e6" stroke-width="0.5" fill="none" opacity="0.3"/>
        </svg>
        
        <svg class="dot" style="top: 18%; left: 55%; width: 4px;" viewBox="0 0 10 10"><circle cx="5" cy="5" r="2" fill="#f5f0e6" opacity="0.4"/></svg>
        <svg class="dot" style="top: 42%; left: 78%; width: 3px;" viewBox="0 0 10 10"><circle cx="5" cy="5" r="1.5" fill="#f5f0e6" opacity="0.3"/></svg>
        <svg class="dot" style="top: 70%; left: 42%; width: 5px;" viewBox="0 0 10 10"><circle cx="5" cy="5" r="2.5" fill="#f5f0e6" opacity="0.5"/></svg>
        <svg class="dot" style="top: 58%; left: 15%; width: 3px;" viewBox="0 0 10 10"><circle cx="5" cy="5" r="1.5" fill="#f5f0e6" opacity="0.4"/></svg>
        <svg class="dot" style="top: 82%; left: 90%; width: 4px;" viewBox="0 0 10 10"><circle cx="5" cy="5" r="2" fill="#f5f0e6" opacity="0.3"/></svg>
    </div>
    
    <div class="content">
        <div class="frase-container">
            <p id="frase" class="frase-text"></p>
            <div class="divider">
                <svg width="200" height="20" viewBox="0 0 200 20">
                    <path d="M0 10 Q50 8 100 10 T200 10" stroke="#f5f0e6" stroke-width="1" fill="none" opacity="0.4"/>
                    <circle cx="100" cy="10" r="2" fill="#f5f0e6" opacity="0.6"/>
                </svg>
            </div>
            <div class="share-section">
                <button id="share-btn" class="share-btn" title="Compartir">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                        <polyline points="16,6 12,2 8,6"/>
                        <line x1="12" y1="2" x2="12" y2="15"/>
                    </svg>
                </button>
                <p class="share-text">Si te gustó la frase, compartila en tu Instagram</p>
            </div>
        </div>
    </div>

    <div id="capture-area" class="capture-area">
        <div class="capture-stars">
            <svg class="capture-star" style="top: 10%; left: 15%; width: 8px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2" fill="#f5f0e6"/></svg>
            <svg class="capture-star" style="top: 20%; left: 80%; width: 6px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1.5" fill="#f5f0e6"/></svg>
            <svg class="capture-star" style="top: 35%; left: 10%; width: 10px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5" fill="#f5f0e6"/></svg>
            <svg class="capture-star" style="top: 50%; left: 85%; width: 7px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1.5" fill="#f5f0e6"/></svg>
            <svg class="capture-star" style="top: 65%; left: 20%; width: 9px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2" fill="#f5f0e6"/></svg>
            <svg class="capture-star" style="top: 80%; left: 75%; width: 5px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1" fill="#f5f0e6"/></svg>
            <svg class="capture-star" style="top: 90%; left: 30%; width: 7px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1.5" fill="#f5f0e6"/></svg>
            <svg class="capture-star" style="top: 45%; left: 5%; width: 5px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1" fill="#f5f0e6"/></svg>
            <svg class="capture-star" style="top: 25%; left: 90%; width: 6px;" viewBox="0 0 20 20"><circle cx="10" cy="10" r="1.5" fill="#f5f0e6"/></svg>
        </div>
        <p id="capture-text"></p>
        <div class="capture-divider">
            <svg width="180" height="20" viewBox="0 0 180 20">
                <path d="M0 10 Q45 8 90 10 T180 10" stroke="#f5f0e6" stroke-width="1" fill="none" opacity="0.4"/>
                <circle cx="90" cy="10" r="2" fill="#f5f0e6" opacity="0.6"/>
            </svg>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
